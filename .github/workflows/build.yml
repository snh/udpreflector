name: Build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    outputs:
      build_identifier: ${{ steps.build_identifier.outputs.value }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Determine build identifier
        id: build_identifier
        run: echo "value=$(date -u +%Y%m%d)-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run static analysis
        run: make vet

      - name: Run tests
        run: make test

      - name: Run race tests
        run: make test-race

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux amd64
            goos: linux
            goarch: amd64
            binary: udpreflector-linux-amd64
            extension: ""
          - name: Linux arm64
            goos: linux
            goarch: arm64
            binary: udpreflector-linux-arm64
            extension: ""
          - name: macOS arm64
            goos: darwin
            goarch: arm64
            binary: udpreflector-macos-arm64
            extension: ""
          - name: Windows amd64
            goos: windows
            goarch: amd64
            binary: udpreflector-windows-amd64
            extension: .exe
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: >-
          make build
          BINARY="dist/${{ matrix.binary }}-${{ needs.test.outputs.build_identifier }}${{ matrix.extension }}"
          BUILD_IDENTIFIER="${{ needs.test.outputs.build_identifier }}"

      - name: Build Debian package
        if: matrix.goos == 'linux'
        env:
          BINARY: dist/${{ matrix.binary }}-${{ needs.test.outputs.build_identifier }}
          BUILD_IDENTIFIER: ${{ needs.test.outputs.build_identifier }}
          PACKAGE_VERSION: ${{ needs.test.outputs.build_identifier }}
        run: ./contrib/debian/build-package.sh "${{ matrix.goarch }}"

      - name: Inspect Debian package
        if: matrix.goos == 'linux'
        env:
          PACKAGE: dist/udpreflector_${{ needs.test.outputs.build_identifier }}_${{ matrix.goarch }}.deb
        run: |
          test "$(dpkg-deb --field "$PACKAGE" Package)" = udpreflector
          test "$(dpkg-deb --field "$PACKAGE" Architecture)" = "${{ matrix.goarch }}"
          dpkg-deb --contents "$PACKAGE" | grep -F './usr/bin/udpreflector' >/dev/null
          dpkg-deb --contents "$PACKAGE" | grep -F './usr/lib/systemd/system/udpreflector@.service' >/dev/null
          dpkg-deb --contents "$PACKAGE" | grep -F './usr/share/doc/udpreflector/examples/udpreflector.conf' >/dev/null
          dpkg-deb --contents "$PACKAGE" | grep -F './etc/udpreflector/' >/dev/null

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}-${{ needs.test.outputs.build_identifier }}
          path: dist/${{ matrix.binary }}-${{ needs.test.outputs.build_identifier }}${{ matrix.extension }}
          if-no-files-found: error

      - name: Upload Debian package
        if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: udpreflector-debian-${{ matrix.goarch }}-${{ needs.test.outputs.build_identifier }}
          path: dist/udpreflector_${{ needs.test.outputs.build_identifier }}_${{ matrix.goarch }}.deb
          if-no-files-found: error

  container:
    name: Build container
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build container
        uses: docker/build-push-action@v7
        env:
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          load: true
          push: false
          tags: udpreflector:${{ needs.test.outputs.build_identifier }}
